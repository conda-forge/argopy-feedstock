{% set name = "argopy" %}
{% set version = "1.5.0" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 6cea4f07ee411eeeaa101787015118484d68dcfc1d2a7d8c90d2723a8d6cdd3a

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - pip
  run:
    - h5netcdf
    - numpy
    - decorator >=5.1
    - netcdf4
    - python >={{ python_min }}
    - aiohttp
    - erddapy
    - fsspec
    - netCDF4 >=1.5.3
    - packaging >=20.4
    - requests
    - scipy
    - toolz
    - xarray >=2025.7
    # imports pkg_resources
    - setuptools >=42

test:
  imports:
    - argopy
    - argopy.data_fetchers
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/euroargodev/argopy
  summary: A python library for Argo data beginners and experts
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
